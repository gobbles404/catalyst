[project]
name = "second"
version = "0.1.0"
description = "A lazy pricing library for commodities derivatives."
readme = "README.md"
authors = [
    { name = "gobbles404", email = "jgiles926@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.166.0",
    "pyright[nodejs]==1.1.411",
    "pytest==9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.6",
]
