[project]
name = "goosedove"
version = "0.1.0"
description = "A lazy pricing library for commodities derivatives."
readme = "README.md"
authors = [
    { name = "gobbles404", email = "jgiles926@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.166.0",
    "pyinstrument==5.1.3",
    "pyright[nodejs]==1.1.411",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = "error"
reportMissingTypeStubs = false
# numpy's stubs cannot express array shapes, so values that enter as object
# stay "partially unknown". Warn, don't fail, until the stubs improve.
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]
