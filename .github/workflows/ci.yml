name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Pinned runner image: "latest" is a moving target, and an image bump that
    # changes libm or runtime behaviour would masquerade as model drift. Bump
    # the pin deliberately and re-run the golden suite first. Python itself is
    # pinned by .python-version (3.13.13), the production runtime.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -n auto
      # The Excel tools' handling of a busy Excel, proved without Excel.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\excel_busy_selftest.ps1
      # The Excel tools' ending of a session whose start failed, also proved without Excel.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\excel_session_selftest.ps1

  measure:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: .\measure.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: profiles/

  host:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: dotnet build host\Goosedove.Host -c Release --nologo
      - run: dotnet test host\Goosedove.Host.Tests -c Release --nologo
      # The host runner must keep compiling; nobody runs timings in CI.
      - run: dotnet build tools\performance\Goosedove.Host.Measure -c Release --nologo
